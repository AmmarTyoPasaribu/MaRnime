name: Supabase Keepalive

# Supabase free-tier projects auto-pause after 7 days with no activity.
# This pings the database every 3 days so it never gets close to that limit.
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to keep the project active
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_ANON_KEY repo secrets." >&2
            exit 1
          fi

          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP status: $status"
          cat /tmp/response.json

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Supabase ping failed with status $status" >&2
            exit 1
          fi

          echo "Supabase is alive."
